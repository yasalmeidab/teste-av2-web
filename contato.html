<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decoração Externa | X'mas Deco</title>
     <link rel="stylesheet" href="style.css">
     <link rel="stylesheet" href="responsividade.css">
</head>
<body>
     <nav class="site-nav" aria-label="Navegação principal">
        <div class="nav-container nav-simples">
            <a class="logo-link" href="index.html" aria-label="Voltar ao início">
                <img src="img/logo.png" alt="Logo da X'mas Deco" class="logo">
            </a>
            <a href="index.html" class="home-button">Voltar ao início</a>
        </div>
    </nav>

    <main>
        <section class="card-formulario">
            <h1>Contato</h1>
            <p>Entre em contato conosco para mais informações sobre nossos produtos e serviços de decoração externa.</p>
            <form  method="post" class="search-form">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>
                <br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <br>
                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="5" required></textarea>
                <br>
                <button type="submit">Enviar</button>
            </form>
        </section>
</body>
</html>
